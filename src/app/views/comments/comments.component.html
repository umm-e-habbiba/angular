<section class="py-4 relative">
  <div class="w-full max-w-7xl mx-auto">
    <div
      class="w-full flex-col justify-start items-start lg:gap-14 gap-7 inline-flex"
    >
      <h2 class="text-gray-900 text-3xl font-bold font-manrope leading-normal">
        Comments
      </h2>
      <div class="w-full flex-col justify-start items-start gap-8 flex">
        <div
          class="w-full lg:p-8 p-5 bg-white rounded-3xl border border-gray-200 flex-col justify-start items-start flex"
          *ngFor="let comment of comments"
        >
          <div class="w-full flex-col justify-start items-start gap-3.5 flex">
            <div class="w-full justify-between items-center inline-flex">
              <div class="justify-start items-center gap-2.5 flex">
                <div
                  class="w-10 h-10 bg-stone-300 rounded-full justify-center items-center gap-2.5 flex text-gray-900 font-bold"
                >
                  <!-- <img
                    class="rounded-full object-cover"
                    src="https://pagedone.io/asset/uploads/1710225753.png"
                    alt="John smith image"
                  /> -->
                  {{ comment.id }}
                </div>
                <div
                  class="flex-col justify-start items-start gap-1 inline-flex"
                >
                  <h5 class="text-gray-900 text-sm font-semibold leading-snug">
                    {{ comment.name.substring(0, 5) }}
                  </h5>
                  <h6 class="text-gray-500 text-xs font-normal leading-5">
                    {{ comment.email }}
                  </h6>
                </div>
              </div>
            </div>
            <p class="text-gray-800 text-sm font-normal leading-snug">
              {{ comment.body }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
